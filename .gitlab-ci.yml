# Integración continua de NexusWST en GitLab (H-17-T03 / SCRUM-197).
# Mismos pasos que .github/workflows/ci.yml: ambos llaman a NexsusWST/scripts/ci.sh.
# Variables de CI/CD (Settings → CI/CD → Variables) para SonarQube:
#   SONAR_HOST_URL, SONAR_TOKEN (enmascarada) y, si es SonarCloud, SONAR_ORGANIZATION.

stages: [test, build, quality]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  GIT_DEPTH: "0"            # SonarQube necesita la historia para asignar problemas
  GOPATH: "$CI_PROJECT_DIR/.go"
  NEXT_TELEMETRY_DISABLED: "1"

.go:
  stage: test
  image: golang:1.26
  cache:
    key: go-$CI_JOB_NAME
    paths: [.go/pkg/mod/]
  rules:
    - changes: ["NexsusWST/**/*", ".gitlab-ci.yml"]

test:core:
  extends: .go
  script: [bash NexsusWST/scripts/ci.sh core]
  artifacts:
    paths: [NexsusWST/backend-core/coverage.out]
    expire_in: 1 week

test:orders:
  extends: .go
  script: [bash NexsusWST/scripts/ci.sh orders]
  artifacts:
    paths: [NexsusWST/orders-service/coverage.out]
    expire_in: 1 week

test:frontend:
  stage: test
  image: node:22
  cache:
    key:
      files: [NexsusWST/frontend-web/package-lock.json]
    paths: [.npm/]
  before_script: [npm config set cache "$CI_PROJECT_DIR/.npm" --global]
  script: [bash NexsusWST/scripts/ci.sh frontend]
  rules:
    - changes: ["NexsusWST/**/*", ".gitlab-ci.yml"]

build:images:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: [apk add --no-cache bash]
  script: [bash NexsusWST/scripts/ci.sh images]
  needs: [test:core, test:orders, test:frontend]
  rules:
    - changes: ["NexsusWST/**/*", ".gitlab-ci.yml"]

sonarqube:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  cache:
    key: sonar
    paths: [.sonar/cache]
  needs: [test:core, test:orders]
  script:
    - ORG_ARG=""; if [ -n "${SONAR_ORGANIZATION:-}" ]; then ORG_ARG="-Dsonar.organization=$SONAR_ORGANIZATION"; fi
    - sonar-scanner -Dsonar.projectBaseDir=NexsusWST $ORG_ARG
  allow_failure: true
  rules:
    - if: $SONAR_TOKEN && $SONAR_HOST_URL
