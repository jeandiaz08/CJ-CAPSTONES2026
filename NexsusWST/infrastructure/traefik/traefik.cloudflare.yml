# Traefik - configuración ESTÁTICA para PRODUCCIÓN DETRÁS DE CLOUDFLARE
# (H-17-T08 / SCRUM-247, PV-20, DA-16). Se usa con docker-compose.cloudflare.yml.
# Diferencias con traefik.prod.yml:
#  - Solo se confía en X-Forwarded-For de las IP de Cloudflare: los servicios
#    ven la IP real del visitante y nadie más puede falsearla.
#  - Todo lo que no venga de Cloudflare recibe 403 (middleware cloudflare-only).
#  - El certificado de Let's Encrypt se obtiene por DNS (API de Cloudflare), así
#    funciona con el proxy naranja activo y modo SSL «Full (strict)».
# Rangos de https://www.cloudflare.com/ips (revisar con ./scripts/cloudflare-ips.sh).

entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs: &cloudflare
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "108.162.192.0/18"
        - "131.0.72.0/22"
        - "141.101.64.0/18"
        - "162.158.0.0/15"
        - "172.64.0.0/13"
        - "173.245.48.0/20"
        - "188.114.96.0/20"
        - "190.93.240.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
    http:
      middlewares: [cloudflare-only@file]
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs: *cloudflare
    http:
      middlewares: [cloudflare-only@file]
      tls:
        certResolver: le

certificatesResolvers:
  le:
    acme:
      # Igual que traefik.prod.yml: editar el correo antes del primer despliegue.
      email: cambiar-por-correo@westorage.cl
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare   # usa CF_DNS_API_TOKEN (permiso Zone:DNS:Edit)
        resolvers: ["1.1.1.1:53", "1.0.0.1:53"]

api:
  dashboard: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: nexuswst_edge
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: WARN

accessLog: {}
