# Redis para NexusWST (DAS §5.4 "Persistencia y separación de Redis")
# Usos: caché de catálogos (con TTL), Pub/Sub (avisos) y Streams (trabajos).

# Persistencia: AOF para no perder trabajos pendientes de Streams
appendonly yes
appendfsync everysec
dir /data

# Snapshot adicional (RDB)
save 900 1
save 300 10

# Memoria: SIN expulsión automática -> nunca se borra un trabajo por falta de
# memoria. Si se llena, Redis rechaza escrituras (vigilar memoria).
# Solo las claves de caché llevan TTL.
maxmemory 256mb
maxmemory-policy noeviction

# Red: escucha dentro de la red Docker; la contraseña se pasa por --requirepass
bind 0.0.0.0
protected-mode yes
