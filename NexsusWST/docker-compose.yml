# =============================================================================
#  NexusWST - Definición BASE de servicios (común a todos los entornos)
# -----------------------------------------------------------------------------
#  Uso:
#    Desarrollo : docker compose up --build
#                 (Compose carga automáticamente docker-compose.override.yml)
#    Producción : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  Topología (DAS §7): 1 contenedor por unidad de ejecución.
#    traefik  -> entrada HTTP(S)/WS(S)                  red: edge
#    frontend -> Next.js  (puerto interno 3000)         red: edge
#    core     -> Monolito modular Go (8080)             redes: edge + data
#    orders   -> Servicio de Órdenes Go (8081)          redes: edge + data
#    postgres -> PostgreSQL (5432)                      red: data
#    redis    -> Redis: caché catálogos, Pub/Sub y Streams (6379)  red: data
#    keycloak -> Proveedor de identidad (login, token, correos)   redes: edge + data
#    migrate-*-> Migraciones one-shot (una vez por arranque, no por la app)
#
#  Regla DAS §7.3: PostgreSQL y Redis NO están en la red "edge", así que Traefik
#  y el navegador no pueden alcanzarlos.
# =============================================================================

name: nexuswst

x-go-healthcheck: &go-healthcheck
  # El binario Go trae su propio chequeo (-healthcheck): funciona incluso en
  # imágenes distroless sin curl/wget.
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy / API Gateway
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Solo lectura: Traefik solo necesita LEER eventos de Docker (DAS §7.3).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Config estática (dev). En prod se reemplaza por traefik.prod.yml.
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - edge

  # ---------------------------------------------------------------------------
  # Front-end Web (React + Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend-web
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # El navegador SIEMPRE usa rutas relativas /api/... a través de Traefik.
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=nexuswst_edge
      - traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN:-localhost}`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000

  # ---------------------------------------------------------------------------
  # Back-end Core: monolito modular Go
  # ---------------------------------------------------------------------------
  core:
    build:
      context: ./backend-core
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: core
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      # Keycloak (DA-11/DA-15): el Core verifica el token y administra
      # usuarios con la Admin API (cuenta de servicio nexus-core).
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost/auth}/realms/nexuswst
      KEYCLOAK_CORE_CLIENT_SECRET: ${KEYCLOAK_CORE_CLIENT_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-core:
        condition: service_completed_successfully
    healthcheck:
      <<: *go-healthcheck
      test: ["CMD", "/app/api", "-healthcheck"]
    networks:
      - edge
      - data
    labels:
      - traefik.enable=true
      - traefik.docker.network=nexuswst_edge
      - traefik.http.routers.core.rule=Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/api/core`)
      - traefik.http.routers.core.middlewares=core-strip,secure-headers@file
      - traefik.http.middlewares.core-strip.stripprefix.prefixes=/api/core
      - traefik.http.services.core.loadbalancer.server.port=8080

  # ---------------------------------------------------------------------------
  # Orders Service: servicio independiente Go (hexagonal) + consumidor Streams
  # ---------------------------------------------------------------------------
  orders:
    build:
      context: ./orders-service
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_NAME: orders
      HTTP_PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}
      REDIS_ADDR: redis:6379
      # Órdenes NO llama al Core (DA-12): verifica el token con las claves
      # públicas de Keycloak y lee el perfil en PostgreSQL.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost/auth}/realms/nexuswst
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      ATTACHMENTS_DIR: /data/attachments
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-orders:
        condition: service_completed_successfully
    healthcheck:
      <<: *go-healthcheck
      test: ["CMD", "/app/api", "-healthcheck"]
    # Da tiempo al consumidor para terminar el trabajo en curso sin confirmar
    # mensajes incompletos (DAS §7.3 "Arranque y apagado").
    stop_grace_period: 30s
    networks:
      - edge
      - data
    labels:
      - traefik.enable=true
      - traefik.docker.network=nexuswst_edge
      # Incluye el WebSocket /api/orders/ws (Traefik hace el upgrade solo).
      - traefik.http.routers.orders.rule=Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/api/orders`)
      - traefik.http.routers.orders.middlewares=orders-strip,secure-headers@file
      - traefik.http.middlewares.orders-strip.stripprefix.prefixes=/api/orders
      - traefik.http.services.orders.loadbalancer.server.port=8081
      # Webhooks de couriers y canales (DA-14): sin JWT, con secreto/firma
      - traefik.http.routers.orders-webhooks.rule=Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/webhooks`)
      - traefik.http.routers.orders-webhooks.service=orders
      - traefik.http.routers.orders-webhooks.middlewares=secure-headers@file

  # ---------------------------------------------------------------------------
  # Keycloak: proveedor de identidad (DAS v1.1 §4.1, DA-15, PV-18)
  # Login, token (JWT RS256, 10 min), renovación, recuperación de contraseña y
  # correos de acceso. Esquema propio "keycloak" en el mismo PostgreSQL.
  # Se publica por Traefik en /auth. El realm se importa como código.
  # ---------------------------------------------------------------------------
  keycloak-db-init:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./infrastructure/keycloak/db-init.sh:/db-init.sh:ro
    entrypoint: ["sh", "/db-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.8.1}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"             # TLS termina en Traefik
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true" # Core/Órdenes usan http://keycloak:8080
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      TZ: ${TZ:-America/Santiago}
      # Valores que usa el realm (infrastructure/keycloak/import)
      KC_APP_URL: ${APP_PUBLIC_URL:-http://localhost}
      KC_CORE_CLIENT_SECRET: ${KEYCLOAK_CORE_CLIENT_SECRET}
      KC_WEB_DIRECT_GRANTS: ${KC_WEB_DIRECT_GRANTS:-false}
      KC_SMTP_HOST: ${SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${SMTP_PORT:-1025}
      KC_SMTP_FROM: ${SMTP_FROM:-no-reply@westorage.cl}
      NEXUS_MAIL_FROM: ${NEXUS_MAIL_FROM:-${SMTP_FROM:-no-reply@westorage.cl}}
      KC_SMTP_AUTH: ${SMTP_AUTH:-false}
      KC_SMTP_USER: ${SMTP_USER:-}
      KC_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KC_SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      KC_SMTP_SSL: ${SMTP_SSL:-false}
    volumes:
      - ./infrastructure/keycloak/import/nexuswst-realm.json:/opt/keycloak/data/import/nexuswst-realm.json:ro
      - ./infrastructure/keycloak/theme/dist_keycloak/nexuswst-keycloak-theme.jar:/opt/keycloak/providers/nexuswst-keycloak-theme.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready con bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - edge
      - data
    labels:
      - traefik.enable=true
      - traefik.docker.network=nexuswst_edge
      - traefik.http.routers.keycloak.rule=(Host(`${APP_DOMAIN:-localhost}`) || Host(`${AUTH_DOMAIN:-localhost}`)) && PathPrefix(`/auth`)
      - traefik.http.routers.keycloak.priority=100
      - traefik.http.routers.keycloak.middlewares=secure-headers@file
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  # ---------------------------------------------------------------------------
  # Migraciones: se ejecutan UNA vez antes de arrancar cada servicio.
  # Cada servicio lleva su propia tabla de control para no pisarse (DAS §6.2).
  # ---------------------------------------------------------------------------
  migrate-core:
    image: migrate/migrate:${MIGRATE_VERSION:-v4.18.3}
    volumes:
      - ./backend-core/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}&x-migrations-table=schema_migrations_core
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  migrate-orders:
    image: migrate/migrate:${MIGRATE_VERSION:-v4.18.3}
    volumes:
      - ./orders-service/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}&x-migrations-table=schema_migrations_orders
      - up
    depends_on:
      postgres:
        condition: service_healthy
      # Órdenes referencia tablas del Core (companies), por eso va después.
      migrate-core:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"

  # ---------------------------------------------------------------------------
  # PostgreSQL: 1 instancia, base única (DA-03)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Santiago}
      PGTZ: ${TZ:-America/Santiago}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

  # ---------------------------------------------------------------------------
  # Redis: caché de catálogos + Pub/Sub (avisos) + Streams (trabajos) - DA-05
  # AOF activado y SIN expulsión automática para no perder trabajos (DAS §5.4).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - data

networks:
  edge:
    name: nexuswst_edge
  data:
    name: nexuswst_data

volumes:
  pgdata:
  redisdata:
  attachments: # documentos adjuntos de las órdenes (H-05)
