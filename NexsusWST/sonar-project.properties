# Análisis de SonarQube / SonarCloud (H-17-T03, QA-07). Lo usan los pipelines de
# GitHub y GitLab; SONAR_HOST_URL y SONAR_TOKEN vienen de sus variables.
# En SonarCloud, la clave debe coincidir con la del proyecto creado allá.
sonar.projectKey=nexuswst
sonar.projectName=NexusWST
sonar.sourceEncoding=UTF-8

sonar.sources=backend-core,orders-service,frontend-web/src
sonar.tests=backend-core,orders-service
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/node_modules/**,**/.next/**,**/vendor/**,**/migrations/**,**/coverage.out

# Cobertura de las pruebas unitarias de Go (la generan los pasos core y orders de scripts/ci.sh).
sonar.go.coverage.reportPaths=backend-core/coverage.out,orders-service/coverage.out
