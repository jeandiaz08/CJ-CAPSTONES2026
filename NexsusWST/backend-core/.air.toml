# Air: recompila y reinicia el servicio Go al guardar cambios (solo desarrollo)
root = "."
tmp_dir = "tmp"

[build]
  # -mod=mod: la primera vez completa go.sum automáticamente
  cmd = "go build -mod=mod -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "sql", "env"]
  exclude_dir = ["tmp", "vendor", "migrations", "tests"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # Polling: necesario con bind mounts en Windows/macOS (los eventos del
  # sistema de archivos no siempre cruzan al contenedor)
  poll = true
  poll_interval = 800
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
